<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mi CV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .cv-wrapper {
      position: relative;
      padding-right: 200px; /* espacio para el banner verde */
    }

    .green-banner {
      background-color: #c4e3cb;
      position: absolute;
      top: 0;
      right: 0;
      width: 200px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .cv-header {
      background-color: #d3d3d3;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .social-icons img {
      width: 30px;
      margin-left: 10px;
    }

    .contact-box {
      background-color: #fceac5;
      padding: 10px;
    }

    .form-box {
      background-color: #d3d3d3;
      padding: 20px;
    }
  </style>
</head>
<body class="container-fluid p-0">

  <div class="cv-wrapper">

    <!-- Banner verde alineado al costado -->
    <div class="green-banner">
      <span>Espacio para banner<br />color verde</span>
    </div>

    <!-- Header -->
    <div class="cv-header px-3">
      <div><strong>MI CV</strong></div>
      <div class="social-icons">
        <span>Enlaces</span>
        <img src="https://img.icons8.com/color/48/facebook.png" alt="Facebook" />
        <img src="https://img.icons8.com/color/48/twitter.png" alt="Twitter" />
        <img src="https://img.icons8.com/color/48/linkedin.png" alt="LinkedIn" />
      </div>
    </div>

    <!-- Cuerpo principal -->
    <div class="row p-3">
      <!-- Izquierda -->
      <div class="col-md-3">
        <div class="bg-secondary text-white p-2 mb-2">Juan Nicolás Perez</div>
        <div class="contact-box mb-2">Datos de contacto</div>
      </div>

      <!-- Foto -->
      <div class="col-md-9 text-center">
        <img src="https://via.placeholder.com/300x300?text=Foto" class="img-fluid" alt="Foto" />
      </div>
    </div>

    <!-- Formulario -->
    <div class="form-box p-3">
      <h5>Contacto</h5>
      <form>
        <div class="row mb-3">
          <div class="col-md-6">
            <input type="text" class="form-control" placeholder="Nombre" />
          </div>
          <div class="col-md-6">
            <input type="email" class="form-control" placeholder="Email" />
          </div>
        </div>
        <div class="row mb-3">
          <div class="col-md-10">
            <input type="text" class="form-control" placeholder="Comentario" />
          </div>
          <div class="col-md-2">
            <button type="submit" class="btn btn-primary w-100">Enviar</button>
          </div>
        </div>
      </form>
    </div>

  </div>

</body>
</html>
