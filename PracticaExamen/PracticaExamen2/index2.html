<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Layout Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    .container-main {
      height: 100%;
      width: 100%;
      border: 1px solid #333;
      padding: 10px;
      box-sizing: border-box;
    }

    .left-box, .right-box {
      height: 100%;
      border: 1px solid #333;
      padding: 10px;
    }

    .row-full-height {
      height: 100%;
    }


  .box {
      border: 1px solid #333;
      padding: 10px;
      margin-bottom: 5px;
      margin-top: 5px;
      display: flex;
    }

      .social-icons img {
      width: 30px; 
      display: flex;
      
      gap: 10px; /* espacio entre los íconos */
    }

    .social-icons  {

      display: flex;
      
      /* espacio entre los íconos */
    }

    .social-icons span {
    margin-right: 10px;
    font-weight: bold;
  }
    .header, .mid, .footer {
    display: flex;
    justify-content: space-between;
  }


  .mid-datos, .footer-datos {
  display: flex;
}

.box.nombre {
  height: 70px;
  background-color: #f0f0f0; /* Opcional, para visualizar mejor */
}

.box.contacto {
  height: 400px;
  background-color: #d0d0d0; /* Opcional */
}
  </style>
</head>
<body>

  <div class="container-fluid container-main">

    <div class="row row-full-height">

      <div class="col-md-10 left-box">
        <div class="header box">

          <div><strong>MI CV</strong></div>

          <div class="social-icons">
            <span>Enlaces</span>
            <img src="https://img.icons8.com/color/48/facebook.png" alt="Facebook" />
            <img src="https://img.icons8.com/color/48/twitter.png" alt="Twitter" />
            <img src="https://img.icons8.com/color/48/linkedin.png" alt="LinkedIn" />
          </div>

        </div>

        <div class="mid box">
          <div class="mid-datos col-md-4">
            <div class="box nombre">
              <strong>Nombre</strong>
            </div>

            <div class="box contacto">
              <strong>Datos de Contacto</strong>
            </div>
          </div>

          <div class="box col-md-7">
            <strong>FOTO</strong>
          </div>
        
        </div>

        <div class="footer box">
          <div class="col-md-12" id="contacto">
            <div class="row">
              <div class="col-md-12">
                <strong>Contacto</strong>
              </div>
            </div>

            <div class="row mt-2 ">
                  <div class="box col-md-4 me-3">
                    <strong>Nombre</strong>
                  </div>

                  <div class="box col-md-4">
                    <strong>Email</strong>
                  </div>
            

            
                  <div class="box col-md-6 me-3">
                    <strong>Comentario</strong>
                  </div>

                  <div class="box col-md-2">
                    <strong>Enviar</strong>
                  </div>
            </div>

          </div>
          
        </div>
      </div>

      <div class="col-md-2 right-box">
        Panel lateral
      </div>

    </div>
  </div>

</body>
</html>
